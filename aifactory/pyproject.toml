[project]
name = "aifactory"
dynamic = ["version"]
description = "GIRO: local control panel and CLI. Goal in. Release out."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["THIRD_PARTY_NOTICES"]
dependencies = [
    "pydantic>=2.13.5,<3",
    "python-dotenv>=1.2.3,<2",
    "pyyaml>=6.0.3,<7",
    "pywinpty>=2,<4; sys_platform == 'win32'",
    "rich>=15.0.0,<16",
    "ruamel-yaml>=0.18.10,<0.19",
    "starlette>=1.7.0,<2",
    "uvicorn>=0.54.0,<0.55",
    "psutil>=7.2.2,<8",
    "tzdata>=2025.2,<2027.0 ; sys_platform == 'win32'",
    "mss>=10,<11",
    "pillow>=12,<13",
]

[project.scripts]
giro = "aifactory.cli:main"
factory = "aifactory.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pytest-xdist>=3.8.0",
    "httpx2>=2.13.1",
    "playwright>=1.49",
    "hatchling>=1.27",
    "types-psutil>=7.2.2.20261111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aifactory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aifactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# shared test helpers (tests/cli_json.py) import as top-level modules;
# "." makes the validation package (validation/, not packaged) importable
pythonpath = ["tests", "."]
# parallel by default (`just test -n0` runs serially; worker count: tests/conftest.py);
# tests marked xdist_group share a worker and run in file order
addopts = "-n auto --dist loadgroup --durations=20"
# test tiers: files listed in tests/tiers.py get these markers
markers = [
    "slow: whole-factory integration test, left out of the fast tier",
    "browser: browser acceptance test, run again when the frontend changes",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "validation", "bundle"]
extend-exclude = [
    # the validation sandbox's own code (foreign to aifactory) and run results
    "validation/template",
    "validation/results",
    # the sample repository of `factory try` is data, not aifactory code
    "src/aifactory/demo/repo",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "validation", "bundle"]
exclude = ["^validation/template/", "^validation/results/", "^src/aifactory/demo/repo/"]
